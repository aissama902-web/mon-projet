<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خريطة AgriDZ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --primary:#2B5D34; --primary-dark:#1E4526; --primary-soft:#E7EFE3;
    --wheat:#C9A356; --soil:#7A5C3E; --bg:#FBF9F4; --border:#E4DFD1;
    --text:#22281F; --muted:#67715F; --danger:#B14733;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; font-family:'Tajawal', Tahoma, sans-serif;}
  html,body{height:100%; margin:0; background:var(--bg); color:var(--text);}
  #map{position:absolute; inset:0; width:100%; height:100%;}
  .topbar{
    position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); inset-inline:10px; z-index:1000;
    display:flex; gap:8px; align-items:center;
  }
  .search{
    flex:1; background:#fff; border:1px solid var(--border); border-radius:999px;
    padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,.08); font-size:14px; outline:none;
  }
  .chips{
    position:absolute; top:calc(58px + env(safe-area-inset-top,0px)); inset-inline:10px; z-index:1000;
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
  }
  .chip{
    background:#fff; border:1px solid var(--border); border-radius:999px; padding:7px 14px;
    font-size:13px; white-space:nowrap; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.06); display:flex; gap:6px; align-items:center;
  }
  .chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .locate-btn{
    position:absolute; bottom:calc(24px + env(safe-area-inset-bottom,0px)); inset-inline-end:14px; z-index:1000;
    width:46px; height:46px; border-radius:50%; background:#fff; border:1px solid var(--border);
    box-shadow:0 2px 8px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px;
  }
  .legend{
    position:absolute; bottom:calc(24px + env(safe-area-inset-bottom,0px)); inset-inline-start:14px; z-index:1000;
    background:rgba(255,255,255,.95); border:1px solid var(--border); border-radius:12px; padding:8px 12px;
    font-size:11px; display:flex; gap:10px; box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .legend span{display:flex; align-items:center; gap:4px;}
  .pin-emoji{font-size:22px; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
  .leaflet-popup-content-wrapper{border-radius:14px;}
  .popup-title{font-weight:800; font-size:14px; margin-bottom:2px;}
  .popup-sub{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .popup-price{font-weight:800; color:var(--primary); margin-bottom:8px;}
  .popup-actions{display:flex; gap:6px;}
  .popup-actions a{
    flex:1; text-align:center; padding:7px 0; border-radius:10px; font-size:12px; font-weight:700; text-decoration:none;
  }
  .btn-call{background:var(--primary); color:#fff;}
  .btn-msg{background:var(--primary-soft); color:var(--primary-dark);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1b1f17; --text:#eef0e9; --border:#3a4032; --muted:#a9b39c; }
    body{background:var(--bg);}
    .search,.chip,.locate-btn,.legend{background:#20261b; color:var(--text); border-color:var(--border);}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <input id="search" class="search" placeholder="ابحث عن منتج، أرض، طبيب...">
</div>
<div class="chips" id="chips"></div>
<div class="locate-btn" id="locateBtn" title="موقعي الحالي">📍</div>
<div class="legend">
  <span>🍅 منتجات</span><span>🌱 أراضي</span><span>🩺 أطباء</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------------- بيانات تجريبية (استبدلها بنداء API حقيقي عند الربط بالخادم) ----------------
const POINTS = [
  {id:'p1', type:'product', emoji:'🍅', title:'طماطم طازجة', sub:'أحمد بلحاج — بسكرة، طولقة', price:'65 دج/kg', phone:'0555123456', lat:34.870, lng:5.732},
  {id:'p2', type:'product', emoji:'🥔', title:'بطاطا صفراء', sub:'كريم مزياني — سطيف، العلمة', price:'55 دج/kg', phone:'0661223344', lat:36.184, lng:5.410},
  {id:'p3', type:'product', emoji:'🌴', title:'تمر دقلة نور', sub:'يوسف بن عمر — ورقلة، تقرت', price:'850 دج/kg', phone:'0770556677', lat:33.108, lng:6.089},
  {id:'p4', type:'product', emoji:'🫒', title:'زيت زيتون بكر', sub:'مراد حداد — بجاية، أقبو', price:'1400 دج/وحدة', phone:'0550889900', lat:36.456, lng:4.535},
  {id:'p5', type:'product', emoji:'🌾', title:'قمح صلب', sub:'فريد شريف — سطيف', price:'48 دج/quintal', phone:'0666112233', lat:36.191, lng:5.408},
  {id:'p6', type:'product', emoji:'🍊', title:'برتقال طوروسبا', sub:'سمير بوزيد — البليدة، موزاية', price:'90 دج/kg', phone:'0540445566', lat:36.494, lng:2.877},
  {id:'l1', type:'land', emoji:'🌱', title:'أرض فلاحية سقوية 3 هكتار', sub:'الطاهر بن يوسف — بسكرة، سيدي عقبة', price:'4,500,000 دج', phone:'0555667788', lat:34.746, lng:5.906},
  {id:'l2', type:'land', emoji:'🌱', title:'أرض للإيجار الموسمي', sub:'رشيد عمراني — البليدة، بوفاريك', price:'900,000 دج', phone:'0661228899', lat:36.575, lng:2.913},
  {id:'v1', type:'vet', emoji:'🩺', title:'د. سليم بوداود', sub:'طب المواشي الكبيرة — سطيف', price:'★ 4.6', phone:'0555120000', lat:36.190, lng:5.413},
  {id:'v2', type:'vet', emoji:'🩺', title:'د. أمينة زروقي', sub:'الدواجن والأرانب — الجزائر، حسين داي', price:'★ 4.9', phone:'0661450000', lat:36.730, lng:3.088},
  {id:'v3', type:'vet', emoji:'🩺', title:'د. كمال إيدير', sub:'الأغنام والماعز — تيزي وزو، عزازقة', price:'★ 4.3', phone:'0770900000', lat:36.740, lng:4.336},
];

const FILTERS = [
  {key:'all', label:'الكل', icon:'🗺️'},
  {key:'product', label:'منتجات', icon:'🍅'},
  {key:'land', label:'أراضي', icon:'🌱'},
  {key:'vet', label:'أطباء', icon:'🩺'},
];

// خريطة حقيقية بمركّبات Pan/Zoom كخرائط جوجل (بلاطات OpenStreetMap — بدون مفتاح API)
const map = L.map('map', {zoomControl:true}).setView([34.5, 4.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function makeIcon(emoji){
  return L.divIcon({
    className: '', html: `<div class="pin-emoji">${emoji}</div>`,
    iconSize:[30,30], iconAnchor:[15,28], popupAnchor:[0,-26]
  });
}

let activeFilter = 'all';
let markers = [];

function popupHtml(p){
  const telHref = 'tel:' + p.phone;
  return `
    <div class="popup-title">${p.title}</div>
    <div class="popup-sub">${p.sub}</div>
    <div class="popup-price">${p.price}</div>
    <div class="popup-actions">
      <a class="btn-call" href="${telHref}">📞 اتصال</a>
      <a class="btn-msg" href="${telHref}">💬 رسالة</a>
    </div>`;
}

function render(){
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const q = document.getElementById('search').value.trim();
  POINTS.filter(p => (activeFilter === 'all' || p.type === activeFilter))
        .filter(p => !q || p.title.includes(q) || p.sub.includes(q))
        .forEach(p => {
          const marker = L.marker([p.lat, p.lng], {icon: makeIcon(p.emoji)}).addTo(map);
          marker.bindPopup(popupHtml(p));
          markers.push(marker);
        });
}

// شرائح التصفية
const chipsEl = document.getElementById('chips');
FILTERS.forEach(f => {
  const el = document.createElement('div');
  el.className = 'chip' + (f.key === 'all' ? ' active' : '');
  el.innerHTML = `<span>${f.icon}</span><span>${f.label}</span>`;
  el.onclick = () => {
    activeFilter = f.key;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    render();
  };
  chipsEl.appendChild(el);
});

document.getElementById('search').addEventListener('input', render);

// زر تحديد الموقع الحالي (كخرائط جوجل)
document.getElementById('locateBtn').onclick = () => {
  if (!navigator.geolocation) return alert('تحديد الموقع غير متاح في هذا المتصفح');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], 13);
      L.marker([latitude, longitude], {
        icon: L.divIcon({ className:'', html:'<div style="width:16px;height:16px;background:#2B5D34;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(43,93,52,.25)"></div>' })
      }).addTo(map).bindPopup('موقعك الحالي').openPopup();
    },
    () => alert('تعذّر الوصول لموقعك — تأكد من إذن الموقع في المتصفح')
  );
};

render();
</script>
</body>
</html>
